version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ci:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      # `oxidhome-sdk` and `oxidhome-manifest` come from the same
      # oxidhome/oxidhome commit and have to move together.
      oxidhome:
        patterns:
          - "oxidhome-*"
