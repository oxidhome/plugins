[package]
name = "oxidhome-kasa-plugin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "TP-Link Kasa plugin for OxidHome: plugs, switches, dimmers, bulbs, strips and cameras on the local network."
# Plugins ship as `.wasm` components next to their `manifest.toml`, not
# as crates, and a crate with a git dependency can't go to crates.io.
publish = false

[lib]
# `cdylib` is the wasm component; `rlib` lets the native tests link.
crate-type = ["cdylib", "rlib"]

[dependencies]
base64.workspace = true
md-5.workspace = true
serde_json.workspace = true

[lints]
workspace = true
