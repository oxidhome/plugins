[workspace]
resolver = "3"
members = ["crates/template"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/svilgelm/oxidhome-plugins"
authors = ["Sergey Vilgelm <sergey@vilgelm.com>"]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
